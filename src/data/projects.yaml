  summary:
    problem: 북미 엔지니어링 시장은 규모가 크지만 진입장벽이 높아, 국내 기업에 필요한 역량을 객관적으로 진단할 기준이 필요했습니다.
    approach: 북미 시장 진출을 위한 핵심역량 모델을 개발하고, 이를 바탕으로 국내 기업의 역량을 평가했습니다.
    outcome: 해외시장 R&D 로드맵(2012)·그린에너지 진출 전략(2009)과 함께 글로벌 진출 전략 연구의 축을 이뤘습니다.
  summary_en:
    problem: North America is a large but hard-to-enter engineering market; Korean firms needed an objective way to assess their readiness.
    approach: Developed a core competency model for market entry and used it to evaluate Korean engineering firms.
    outcome: Together with an overseas R&D roadmap (2012) and a green-energy entry strategy (2009), it anchors the lab's global market research.

