- id: 2016-best-value-procurement
  title: 건설기술용역 종합심사낙찰제 도입 연구 (1~3차)
  title_en: Introducing Best-Value Procurement for Construction Engineering Services (Phase 1–3)
  client: 국토교통부
  start: 2016
  end: 2017
  area: policy
  featured: true
  order: 3
  image: feat-procurement.jpg
  related: [2018-best-value-guideline]
  summary:
    problem: 가격 위주의 건설기술용역 낙찰 방식으로는 기술력이 우수한 업체를 선별하기 어렵다는 문제가 제기되었습니다.
    approach: 기술력과 가격을 종합 평가하는 종합심사낙찰제의 도입 방안을 여러 차례의 연속 연구로 설계했습니다.
    outcome: 2018년 발주자 운영지침 마련 연구로 이어지며, 국가 발주제도의 설계부터 현장 운영까지 함께했습니다.
  summary_en:
    problem: Price-driven awards for engineering services made it hard to select the most technically capable firms.
    approach: Designed a best-value scheme that weighs technical capability and price together, across consecutive study phases for MOLIT.
    outcome: Followed by the 2018 owner's operating-guideline study — supporting a national procurement reform from design to day-to-day operation.

