    approach: 공공공사비 산정 및 관리 실태를 분석하고, 산정 기준과 관리 체계 전반의 제도적 개선 방안을 마련했습니다.
    outcome: 실적공사비 폐지(2015)·공사비 적정성(2016) 연구에 이은 공사비 연구 시리즈로, 적정 공사비 논의의 근거를 제시했습니다.
  summary_en:
    problem: Inadequately estimated public construction costs lead to lower quality, disputes and an unhealthy industry.
    approach: Analyzed how public construction costs are estimated and managed, and proposed institutional improvements to standards and processes.
    outcome: Part of a multi-year cost research series (2015 · 2016 · 2018) that has informed the national debate on adequate construction costs.

