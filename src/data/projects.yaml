- id: 2025-quality-management
  title: 건설품질 관리체계 개선 연구
  title_en: Improving the Construction Quality Management Framework
  client: 국토교통부
  start: 2025
  end: 2026
  area: policy
  featured: true
  order: 2
  image: feat-quality.jpg
  related: [2015-construction-promotion-act]
  summary:
    problem: 건설기술진흥법에 품질관리 제도가 갖춰져 있지만, 현장에서는 품질관리 부실에 따른 사고와 하자가 반복되며 제도와 현장 이행 사이의 간극이 드러났습니다.
    approach: 토목·건축 실무자 심층 인터뷰와 국토교통부 민원 분석, 해외 주요국 제도 비교로 원인을 진단하고, 국토안전관리원·민관협의체 검토를 거쳐 개선안을 다듬었습니다.
    outcome: 품질관리계획 수립 기준 현실화, 변경관리 등급제, 공종별 품질관리비 요율 모델, 품질관리 인력 단가 정비 등을 법령 개정안으로 제시했습니다.
  summary_en:
    problem: Korea's Construction Technology Promotion Act sets out quality management rules, yet defects and accidents caused by poor quality control keep recurring — a gap between the rules and what happens on site.
    approach: Diagnosed the causes through in-depth interviews with civil and building practitioners, analysis of public complaints filed with MOLIT and a review of other countries' systems, then refined the proposals with the national infrastructure safety authority and a public–private council.
    outcome: Proposed legal amendments covering realistic thresholds for quality plans, a tiered change-management process, a quality-cost rate model by work type and clearer labor rates for quality staff.

- id: 2026-multipurpose-robot
  title: 공동주택 건설생산성 혁신을 위한 다용도 건설작업로봇 설계 및 통합관리 기술
  title_en: Multi-Purpose Construction Robots and Integrated Management for Apartment Housing Productivity
  client: 국토진흥원
  start: 2026
  area: smart
  featured: true
  order: 1
  image: feat-robot.jpg
  related: [2019-blockchain-marketplace, 2018-drone-iot-safety]
  summary:
    problem: 공동주택 현장은 숙련 인력 부족과 정체된 생산성이라는 구조적 한계에 부딪혀 있습니다.
    approach: 여러 공정에 투입할 수 있는 다용도 건설작업로봇을 설계하고, 현장 공정에 맞춰 로봇을 운영하는 통합관리 기술을 개발합니다.
    outcome: 진행 중인 국가 R&D로, 로봇과 사람이 함께 일하는 공동주택 현장의 관리 모델을 만들어 가고 있습니다.
  summary_en:
    problem: Apartment construction faces a shrinking skilled workforce and stagnant productivity.
    approach: Designing multi-purpose construction robots for multiple work packages, plus an integrated management system that runs them in step with the site schedule.
    outcome: An ongoing national R&D project building the management model for sites where robots and people work side by side.
