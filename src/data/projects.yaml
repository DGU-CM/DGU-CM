    approach: 2013년 건설관리 효율화 방안 연구에 이어, 2015년 사업의 건설사업관리(CM) 컨설팅을 수행했습니다.
    outcome: 연구에서 컨설팅으로 이어진 연속 수행으로 국방 메가프로그램의 사업관리 체계 개선을 지원했습니다.
  summary_en:
    problem: The USFK base relocation is a national mega-program with many facilities and stakeholders — it demands rigorous construction management.
    approach: Following a 2013 study on improving the program's construction management, the lab delivered CM consulting for the Ministry of National Defense in 2015.
    outcome: Two consecutive engagements — from research to hands-on consulting — that supported better management of a defense mega-program.

